name: Sync Avance de Producto

# Se dispara:
#  1. Al instante, cuando el Apps Script de "Data - Project ISSS" llama a
#     repository_dispatch tras un onEdit en la hoja 'avance_tramite'.
#  2. Manualmente (workflow_dispatch), para probar o forzar una corrida.
#  3. Cada 3 horas como respaldo, por si el webhook del Sheet falla o no
#     se disparó (Apps Script caído, PAT vencido, etc.).
on:
  repository_dispatch:
    types: [avance-tramite-updated]
  workflow_dispatch: {}
  schedule:
    - cron: '0 */3 * * *'

# Evita que dos corridas se pisen si llegan varios onEdit seguidos.
concurrency:
  group: sync-avance-producto
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/roadmap-sync-2026-09-11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sincronizar avance_producto.json desde el Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: node scripts/sync-avance-producto.js --write

      - name: Ver si avance_producto.json cambio de verdad
        id: diff
        run: |
          if git diff --quiet -- public/data/avance_producto.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit + push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/avance_producto.json
          git commit -m "Auto-sync avance_producto.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push origin HEAD:chore/roadmap-sync-2026-09-11

      - name: Credencial de Firebase para el deploy
        if: steps.diff.outputs.changed == 'true'
        run: |
          cat > "$RUNNER_TEMP/firebase-sa.json" <<EOF
          {
            "type": "service_account",
            "project_id": "product-roadmap-isss",
            "private_key": "${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}",
            "client_email": "${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}",
            "token_uri": "https://oauth2.googleapis.com/token"
          }
          EOF

      - name: Deploy a Firebase Hosting
        if: steps.diff.outputs.changed == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx firebase-tools@14 deploy --only hosting --project product-roadmap-isss
