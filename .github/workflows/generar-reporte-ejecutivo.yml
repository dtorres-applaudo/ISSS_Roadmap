name: Generar Reporte Ejecutivo

# Genera public/reports/latest.html + latest-summary.json (Resumen Ejecutivo
# del sprint activo) y los despliega a Firebase Hosting, para que Power
# Automate los recoja por HTTP y arme el correo programado.
#
# Esquema (definido por Darío, 2026-10-02 — todo en hora El Salvador, CST = UTC-6
# todo el año, sin horario de verano). Este workflow genera el reporte a la hora
# indicada y el flujo de n8n lo envía 20 minutos después:
#   Día 1  del sprint: lunes 6:00 PM     -> envío 6:20 PM  (inicio de sprint)
#   Día 3  del sprint: miércoles 2:00 PM -> envío 2:20 PM  (avance día 3)
#   Día 5  del sprint: viernes 2:00 PM   -> envío 2:20 PM  (avance día 5)
#   Día 8  del sprint: miércoles 2:00 PM -> envío 2:20 PM  (avance día 8; mismo
#                       horario que el día 3: un sprint de 2 semanas tiene
#                       exactamente 2 miércoles, así que un solo cron cubre ambos)
#   Día 10 del sprint: viernes 7:00 PM   -> envío 7:20 PM  (cierre de sprint)
#
# Como cron no sabe en qué día del sprint está el calendario, estos 4 triggers
# disparan TODAS las semanas; el script calcula el día real del sprint activo y
# lo deja en latest-summary.json como kpis.dia_sprint / kpis.send_today, y n8n
# solo envía si coincide con el disparador. Ojo: GitHub puede retrasar los cron
# programados varios minutos en horas de carga; el margen de 20 min a n8n es el
# que hay para que el reporte ya esté publicado.
on:
  schedule:
    - cron: '0 0 * * 2'  # lunes 6:00 PM CST = martes 0:00 UTC (día 1)
    - cron: '0 20 * * 3'  # miércoles 2:00 PM CST (días 3 y 8)
    - cron: '0 20 * * 5'  # viernes 2:00 PM CST (día 5)
    - cron: '0 1 * * 6'  # viernes 7:00 PM CST = sábado 1:00 UTC (día 10)
  workflow_dispatch: {}

concurrency:
  group: generar-reporte-ejecutivo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias (puppeteer)
        run: npm install

      - name: Generar reporte ejecutivo (Puppeteer headless)
        run: node scripts/generar-reporte-sprint.js

      - name: Deploy a Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          projectId: product-roadmap-isss
          channelId: live
