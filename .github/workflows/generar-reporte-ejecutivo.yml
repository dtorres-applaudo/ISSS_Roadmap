name: Generar Reporte Ejecutivo

# Genera public/reports/latest.html + latest-summary.json (Resumen Ejecutivo
# del sprint activo) y los despliega a Firebase Hosting, para que Power
# Automate los recoja por HTTP y arme el correo programado.
#
# Esquema de envío (definido por Darío, 2026-10-01 — todo en hora El Salvador,
# CST = UTC-6 todo el año, sin horario de verano):
#   Día 1  del sprint: lunes 6:00 PM  — inicio de sprint
#   Día 3  del sprint: miércoles 2:00 PM — avance día 3
#   Día 5  del sprint: viernes 2:00 PM   — avance día 5
#   Día 8  del sprint: miércoles 2:00 PM — avance día 8 (mismo horario que el día 3:
#                       cae en el miércoles de la semana 2 del sprint, un sprint de
#                       2 semanas tiene exactamente 2 miércoles, así que un solo
#                       disparador semanal de miércoles cubre ambos)
#   Día 10 del sprint: viernes 7:00 PM   — cierre de sprint
#
# Este workflow dispara 20 minutos ANTES de cada hora de envío de arriba, para
# que el archivo ya esté listo cuando Power Automate lo busque. Como cron no
# sabe en qué día del sprint está el calendario, estos 4 triggers disparan
# TODAS las semanas (p.ej. el de lunes dispara en ambas semanas del sprint);
# el propio script calcula el día real del sprint activo y lo deja en
# latest-summary.json como `kpis.send_today` / `kpis.motivo` — el flujo de
# Power Automate es el que de verdad decide si corresponde enviar o no,
# leyendo ese booleano (ver guía de los pasos 4-7).
on:
  schedule:
    - cron: '40 23 * * 1'  # lunes 5:40 PM CST (antes del envío de día 1, lunes 6:00 PM)
    - cron: '40 19 * * 3'  # miércoles 1:40 PM CST (antes del envío de días 3/8, miércoles 2:00 PM)
    - cron: '40 19 * * 5'  # viernes 1:40 PM CST (antes del envío de día 5, viernes 2:00 PM)
    - cron: '40 0  * * 6'  # viernes 6:40 PM CST = sábado 0:40 AM UTC (antes del envío de día 10, viernes 7:00 PM)
  workflow_dispatch: {}

concurrency:
  group: generar-reporte-ejecutivo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias (puppeteer)
        run: npm install

      - name: Generar reporte ejecutivo (Puppeteer headless)
        run: node scripts/generar-reporte-sprint.js

      - name: Deploy a Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          projectId: product-roadmap-isss
          channelId: live
